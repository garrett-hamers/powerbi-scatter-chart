name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:full
      - run: npm run build
      - run: npm run package
      - run: npm run certification-audit
      # certification-audit starts with "clean", so the probe runs afterwards to keep its
      # report in dist for the artifact upload.
      - run: npm run layout-probe
      - run: npm run prove-regressions
      - run: npm run publication-audit
      - run: npm run audit
      - run: npm run release-manifest
      - uses: actions/upload-artifact@v4
        with:
          name: atlyn-scatter-pbiviz
          path: |
            dist/*.pbiviz
            dist/release-manifest.json
            dist/layout-probe.json
            dist/regression-proof.json
