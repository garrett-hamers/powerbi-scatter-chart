name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run eslint
      - run: npm run build
      - run: npm run package
      - run: npm run certification-audit
      # certification-audit starts with "clean", so the probe runs afterwards to keep its
      # report in dist for the artifact upload.
      - run: npm run layout-probe
      # The listing screenshots are captured and asserted here, never published here:
      # --check leaves assets/screenshots untouched so the runner's font stack cannot churn
      # the committed images, while a scene that stops rendering still fails the build.
      # Headless Chromium is already a proven dependency of this job via layout-probe, and
      # every scene assertion is an element count or a geometry relation rather than a pixel
      # or text-metric comparison, so a different font stack does not move them.
      - run: npm run screenshots:check
      - run: npm run prove-regressions
      - run: npm run publication-audit
      - run: npm run audit
      - run: npm run release-manifest
      - uses: actions/upload-artifact@v7
        with:
          name: atlyn-scatter-pbiviz
          path: |
            dist/*.pbiviz
            dist/release-manifest.json
            dist/layout-probe.json
            dist/regression-proof.json
