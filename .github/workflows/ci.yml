name: CI

on:
  push:
    branches: ["main", "**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint:full
      - run: npm run build
      - run: npm run package
      - run: npm run certification-audit
      - run: npm run audit
      - uses: actions/upload-artifact@v4
        with:
          name: atlyn-scatter-pbiviz
          path: dist/*.pbiviz
